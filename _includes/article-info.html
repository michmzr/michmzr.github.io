<div class="article-meta"><time datetime="{{ include.article.date | date_to_xmlschema }}">{{ include.article.date | date: '%d %b %Y' }}</time><span>{{ include.article.lang | default: site.lang | upcase }}</span><span>{{ site.author.name }}</span></div>
<div class="tag-links">{% for tag in include.article.tags %}<a href="{{ '/archive.html' | relative_url }}?tag={{ tag | url_encode }}">{{ tag }}</a>{% endfor %}</div>
