<header class="site-header" lang="en">
  <div class="site-container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="CyberShu home">Cyber<span>Shu</span></a>
    <div class="header-actions">
      {% if site.search.provider %}<button class="search-trigger" data-search-open aria-haspopup="dialog">Search <span aria-hidden="true">↗</span></button>{% endif %}
      <button class="menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="site-navigation" hidden>Menu <span aria-hidden="true">+</span></button>
    </div>
    <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.layout == 'home' %}aria-current="page"{% endif %}>Articles</a>
      {% for item in site.data.navigation.header %}
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{% if item.title %}{{ item.title }}{% else %}{{ item.titles.en | remove: '🤙' }}{% endif %}</a>
      {% endfor %}
    </nav>
  </div>
</header>
