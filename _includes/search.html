<dialog id="site-search" class="search-dialog" aria-labelledby="search-title" lang="en">
  <div class="dialog-heading"><h2 id="search-title">Search articles</h2><button data-search-close aria-label="Close search">Close {% include icons/close.svg %}</button></div>
  <label for="search-query">Title or keyword</label>
  <div class="search-field"><input id="search-query" type="search" autocomplete="off" placeholder="Try architecture, AI, Spring…"><button data-search-clear>Clear</button></div>
  <p data-search-status role="status" aria-live="polite">Enter a title or keyword to find an article.</p><ul data-search-results class="search-results"></ul>
</dialog>
<script src="{{ '/assets/search.js' | relative_url }}" defer></script>
